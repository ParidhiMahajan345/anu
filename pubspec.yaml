name: anubhavx
description: AnubhavX – VR Temple Tourism App | Patent-Level Spiritual Experience

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0

  # Audio
  audioplayers: ^5.2.1

  # Video & WebView
  youtube_player_flutter: ^9.0.3
  webview_flutter: ^4.7.0

  # Navigation
  url_launcher: ^6.3.0

  # Storage
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/welcome.mp3
    - assets/bell.mp3
    - assets/temple.apk
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"